# Every knob of the snowboard env, with its default. The defaults are the demo setup (stage 3, docs/RL_TRAINING.md);
# a stage file in stages/ lists only what it changes. Physical facts (rider size, board, snow) are in
# envs/physical.yaml, PPO in ppo.yaml. One-off experiments: train.py --set key=value (rewards.key=value).
# SI units; angles in degrees.

env:
  # --- hill and episode ----------------------------------------------------------------------------------------
  slope_deg: 9                  # steeper slope, higher speed: a 40°+ edge balances only above ~7 m/s
  episode_length_s: 20
  run_length: null              # m down the hill that ends the episode as a time-out (play sets 100); null: off

  # --- start of each episode -----------------------------------------------------------------------------------
  start_speed_turns: [4, 5.5]   # m/s, drawn per episode
  start_heading_deg: 20         # heading drawn within ± this of the fall line
  carve_start: false            # true: start balanced on an edge (the edge that balances the start speed)
  carve_start_toe_frac: 0.8     # with carve_start: share of starts on the toe edge
  speed_cmd: [6, 8]             # m/s, observed only (the trained policies saw it); not rewarded

  # --- falls ---------------------------------------------------------------------------------------------------
  lying_deg: 95                 # torso tilt that counts as lying (a deep toe carve bows it 55–70°)
  fall_height: 0.15             # m, pelvis above the snow
  sitting_height: 0.12          # m, pelvis above the board
  on_side_deg: 85               # board edge angle that counts as on its side
  reverse_slip_deg: 100         # riding tail first (slip past this) ...
  reverse_min_speed: 2.0        # ... above this speed [m/s] counts as a fall
  min_turn_deg: 55              # path swing that makes a turn count (logging and the turn observation)
  turn_min_speed: 5.0           # m/s, slower crossings of the fall line don't count as turns

  # --- edge command: the signed edge angle to track (heel < 0, toe > 0) ----------------------------------------
  edge_cmd_mode: heading        # timer: heel ↔ toe on a period. heading: switch once the turn has come round
  edge_cmd_amp_deg: [25, 45]    # amplitude at curriculum level 0 → 1
  edge_cmd_period_s: [5.0, 4.0] # timer mode: period at level 0 → 1, ±15% per episode
  edge_cmd_sharpness: 1.8       # timer mode: 1 = sine, higher = flatter tops (trapezoid)
  edge_cmd_heading_deg: 50      # heading mode: switch edges once the path is this far across the hill
  edge_cmd_center_deg_per_m: 2  # heading mode: shift the switch heading per metre off the centre (steers back)
  edge_cmd_center_max_deg: 25   # cap on that shift
  edge_cmd_min_s: 1.0           # heading mode: at least this long on one edge
  edge_cmd_max_s: 4.0           # heading mode: at most this long on one edge
  edge_cmd_ramp_s: 0.6          # heading mode: time to ramp through flat to the other edge
  edge_cmd_hold: false          # hold the start edge all episode (scripts/switch_test.py)

  # --- curriculum on the edge command --------------------------------------------------------------------------
  edge_cmd_level_init: 0.0      # level 0 → 1 scales amplitude and period between their two values
  edge_cmd_level_fixed: false   # true: keep the level (play fixes it at 1)
  edge_cmd_level_up_deg: 12     # level rises while the running edge error is below this, falls above twice it
  edge_cmd_level_steps: 2000    # steps to go from level 0 to 1

  # --- recorded-state starts (RSI): restart from recorded toe carves, where the switch to the heel is hardest ---
  rsi_frac: 0.3                 # share of episodes restarted from a recorded state
  rsi_min_s: 3.0                # record only after this long in an episode
  rsi_toe_deg: 12               # record only on the toe edge past this angle
  rsi_buffer: 8192              # states kept
  rsi_min_samples: 256          # restart from recorded states only once this many are kept
  rsi_per_step: 32              # at most this many states recorded per step

  # --- simulation ---------------------------------------------------------------------------------------------
  physics_hz: 120               # PhysX and snow model rate; a multiple of the 30 Hz policy
  solver_iterations: [32, 4]    # PhysX position, velocity iterations

  # --- rider options (docs/HUMANOID_MODEL.md §6); stance width and binding angles: envs/physical.yaml ----------
  stance_tag: squat4            # stance pose envs/assets/stances/stance_<front>_<back>_<tag>.yaml
  rider_to_height: true         # scale the humanoid to the rider height in envs/physical.yaml
  pelvis_mass_frac: 0.2         # share of the rider mass in the pelvis
  knee_rotation: true           # a knee rotation joint (twists the shin)
  passive_joints: [knee:2]      # joints left to their drives at the stance target, not actuated
  ankle_range_deg: {x: 45, y: 80, z: 55}
  torso_twist_deg: 90           # abdomen twist range
  arm_stiffness_scale: 0.3
  arm_action_scale: 0.5
  stiff_boots: true             # boots: ankles stiff within boot_range_deg
  boot_range_deg: {y: [-5, 15], x: [-5, 5], z: [-5, 5]}
  board_flex: false             # two-half board (docs/BOARD_MODEL.md §4), never trained on
  thoracic: false
  compliant_drives: false

  # --- actions (docs/HUMANOID_MODEL.md §5) ---------------------------------------------------------------------
  action_scale: 0.25            # fraction of each joint's half-range per unit action
  synergy: true                 # two extra actions (edge, lean) driving joint groups
  synergy_toe_rad: {left_knee: 0.4, right_knee: 0.4, left_hip_y: -0.3, right_hip_y: -0.3}  # added on the toe edge
  synergy_smooth: 0.35          # EMA weight of a new synergy action; 1 = no smoothing
  joint_smooth: 0.35            # EMA weight of a new joint action

# Reward: per-second weights (fall: once) and term shapes, docs/RL_TRAINING.md §4.
rewards:
  edge_cmd: 30                  # track the commanded edge: exp(-(e/σ)²), 0 while the board is flat
  edge_cmd_sigma_deg: 30        # wide, so crossing flat toward the new edge already pays
  edge_side: 20                 # +1 on the commanded side, -1 on the other: starting the switch pays
  pose_ref: 10                  # legs and centre of mass lean as in the double pendulum (angulation)
  pose_ref_legs: 1.15           # legs lean = 1.15 × command
  pose_ref_com: 0.77            # COM lean = 0.77 × legs lean
  pose_ref_sigma_deg: 15
  rise: 30                      # come up through the edge change: pelvis height while the command is near flat
  tilt: -10                     # torso bowed past tilt_free_deg: a deep bow can't get back to the heel
  tilt_free_deg: 50
  grab: 10                      # inside hand toward its grab point on the board (counter-angulation)
  grab_linear_m: 1.2            # linear falloff to 0 at 1.2 m; 0: Gaussian with grab_sigma_m
  grab_sigma_m: 0.6
  fall: -50                     # once, a fall or a fence: more than 2 s of edge reward
