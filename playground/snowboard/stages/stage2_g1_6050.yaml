# Stage 2 for the G1 from scratch: stage 2 (edge changes on a timer) with the stage3_g1_6050 setup (60/50 bindings,
# Isaac Lab's stock drives). Use with --set robot=g1; warm-start stage3_g1_6050 from it.

env:
  slope_deg: 7
  episode_length_s: 10
  carve_start: true
  edge_cmd_mode: timer
  edge_cmd_amp_deg: [15, 30]
  edge_cmd_period_s: [6.0, 4.0]
  edge_cmd_max_s: 3.0
  edge_cmd_center_deg_per_m: 0
  rsi_frac: 0.5
  binding_angles_deg: [60, 50]
  g1_gains: isaac
  arm_action_scale: 0.5
  free_action_scale: {}
  synergy_edge_rad: {left_knee_joint: 0.5, right_knee_joint: 0.5, left_ankle_pitch_joint: -0.3, right_ankle_pitch_joint: -0.3}

rewards:
  grab: 5
  grab_linear_m: 0
