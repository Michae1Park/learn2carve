# Stage 3 for the G1 on 70/65 bindings, 0.42 m stance (stance_70_65_g1, hinged forward, hips toward the tail),
# stock drives. Warm-start from a stage2_g1_7065 run: --set robot=g1 --init_from <run>. Otherwise as stage 3 (env.yaml).

env:
  binding_angles_deg: [70, 65]
  stance_width: 0.42
  g1_gains: isaac
  arm_action_scale: 0.5
  free_action_scale: {}
  synergy_edge_rad: {left_knee_joint: 0.5, right_knee_joint: 0.5, left_ankle_pitch_joint: -0.3, right_ankle_pitch_joint: -0.3}
  g1_arm_gains: [300, 15]       # arms only: stock kp 3000 / kd 10 is underdamped and wobbles

rewards: {}
