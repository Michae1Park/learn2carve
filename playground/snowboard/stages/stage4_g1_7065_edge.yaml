# G1 edge push on the 70/65 setup (stage3_g1_7065: stock drives, arms kp 300 / kd 15): command deeper edges so the
# carve holds 40°+. Warm-start from a stage3_g1_7065 run: --set robot=g1 --init_from <run>.

env:
  binding_angles_deg: [70, 65]
  stance_width: 0.42
  g1_gains: isaac
  arm_action_scale: 0.5
  free_action_scale: {}
  synergy_edge_rad: {left_knee_joint: 0.5, right_knee_joint: 0.5, left_ankle_pitch_joint: -0.3, right_ankle_pitch_joint: -0.3}
  g1_arm_gains: [300, 15]
  edge_cmd_amp_deg: [35, 55]    # amplitude at curriculum level 0 → 1 (stage 3: [25, 45])
  edge_cmd_level_init: 0.5      # the stage 3 policy already tracks 45°: start halfway (45°)

rewards: {}
