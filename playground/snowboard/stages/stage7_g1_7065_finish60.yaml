# G1 turn finish on the 70/65 setup: as stage6_g1_7065_edge75, edges switch at 60° across the hill (env.yaml 50°)
# so turns finish further round. Warm-start from a stage6_g1_7065_edge75 run: --set robot=g1 --init_from <run>.

env:
  binding_angles_deg: [70, 65]
  stance_width: 0.42
  g1_gains: isaac
  arm_action_scale: 0.5
  free_action_scale: {}
  synergy_edge_rad: {left_knee_joint: 0.5, right_knee_joint: 0.5, left_ankle_pitch_joint: -0.3, right_ankle_pitch_joint: -0.3}
  g1_arm_gains: [300, 15]
  edge_cmd_amp_deg: [55, 75]    # stage 5: [45, 65]
  edge_cmd_level_init: 1.0      # the stage 6 policy tracks the full range
  edge_cmd_heading_deg: 60      # switch edges once the path is 60° across the hill

rewards: {}
