# G1 second edge push on the 70/65 setup (as stage4_g1_7065_edge, command up to 65°). Warm-start from a
# stage4_g1_7065_edge run: --set robot=g1 --init_from <run>.

env:
  binding_angles_deg: [70, 65]
  stance_width: 0.42
  g1_gains: isaac
  arm_action_scale: 0.5
  free_action_scale: {}
  synergy_edge_rad: {left_knee_joint: 0.5, right_knee_joint: 0.5, left_ankle_pitch_joint: -0.3, right_ankle_pitch_joint: -0.3}
  g1_arm_gains: [300, 15]
  edge_cmd_amp_deg: [45, 65]    # stage 4: [35, 55]
  edge_cmd_level_init: 0.5      # the stage 4 policy tracks 55°: start halfway (55°)

rewards: {}
