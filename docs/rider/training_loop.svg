<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Training loop: 2048 parallel envs; the policy maps a 129-d observation to 28 joint targets at 30 Hz; PhysX and the snow model step four times at 120 Hz; 24-step rollouts feed PPO updates</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .name { font-size: 22px; font-weight: 700; fill: #111827; }
      .sub { font-size: 17px; fill: #374151; }
      .tag { font-size: 16px; font-weight: 700; fill: #374151; }
      .num { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .wire { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .band { fill: #F9FAFB; stroke: #D1D5DB; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .policy { fill: #F2ECFF; stroke: #7C4DDB; stroke-width: 2; }
      .sim { fill: #EAF2FF; stroke: #2F6FDB; stroke-width: 2; }
      .snow { fill: #FFF4E0; stroke: #D98A00; stroke-width: 2; }
      .learn { fill: #E8F6EC; stroke: #2E9E50; stroke-width: 2; }
    </style>
  </defs>

  <!-- solid card: readable in GitHub's light and dark themes -->
  <rect x="1" y="1" width="1198" height="498" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- physics band -->
  <rect x="404" y="24" width="772" height="204" rx="14" class="band"/>
  <text x="424" y="52" class="tag">×4 per policy step · 120 Hz · 2048 envs in parallel</text>

  <!-- 1 policy -->
  <rect x="24" y="96" width="300" height="104" rx="12" class="policy"/>
  <circle cx="52" cy="128" r="16" fill="#7C4DDB"/><text x="52" y="134" class="num" text-anchor="middle">1</text>
  <text x="78" y="136" class="name">Policy π(a | o)</text>
  <text x="44" y="176" class="sub">MLP 512-256-128, Gaussian</text>

  <!-- 2 PD -->
  <rect x="428" y="96" width="220" height="104" rx="12" class="sim"/>
  <circle cx="456" cy="128" r="16" fill="#2F6FDB"/><text x="456" y="134" class="num" text-anchor="middle">2</text>
  <text x="482" y="136" class="name">PD joints</text>
  <text x="448" y="176" class="sub">targets → torques</text>

  <!-- 3 snow -->
  <rect x="680" y="96" width="220" height="104" rx="12" class="snow"/>
  <circle cx="708" cy="128" r="16" fill="#D98A00"/><text x="708" y="134" class="num" text-anchor="middle">3</text>
  <text x="734" y="136" class="name">Snow</text>
  <text x="700" y="176" class="sub">board wrench, drag</text>

  <!-- 4 physx -->
  <rect x="932" y="96" width="220" height="104" rx="12" class="sim"/>
  <circle cx="960" cy="128" r="16" fill="#2F6FDB"/><text x="960" y="134" class="num" text-anchor="middle">4</text>
  <text x="986" y="136" class="name">PhysX</text>
  <text x="952" y="176" class="sub">integrate rider + board</text>

  <!-- 5 reward -->
  <rect x="680" y="280" width="472" height="104" rx="12" class="sim"/>
  <circle cx="708" cy="312" r="16" fill="#2F6FDB"/><text x="708" y="318" class="num" text-anchor="middle">5</text>
  <text x="734" y="320" class="name">Observe, reward, done</text>
  <text x="700" y="360" class="sub">129-d obs · tracking reward · fell / fence / time</text>

  <!-- 6 buffer + PPO -->
  <rect x="24" y="280" width="300" height="104" rx="12" class="learn"/>
  <circle cx="52" cy="312" r="16" fill="#2E9E50"/><text x="52" y="318" class="num" text-anchor="middle">6</text>
  <text x="78" y="320" class="name">PPO update</text>
  <text x="44" y="360" class="sub">every 24 steps: 49k samples</text>

  <!-- wires -->
  <path d="M324,148 L424,148" class="wire"/>
  <text x="338" y="136" class="tag">a ∈ ℝ²⁸</text>
  <path d="M648,148 L676,148" class="wire"/>
  <path d="M900,148 L928,148" class="wire"/>
  <path d="M1042,200 L1042,276" class="wire"/>
  <path d="M676,332 L328,332" class="wire"/>
  <text x="420" y="320" class="tag">(o, a, r, done) × 2048</text>
  <path d="M174,280 L174,204" class="wire"/>
  <text x="186" y="248" class="tag">new weights</text>
  <path d="M916,384 L916,440 L12,440 L12,148 L20,148" class="wire" stroke-dasharray="6 5"/>
  <text x="440" y="468" class="tag">o (next step, 30 Hz)</text>
</svg>
