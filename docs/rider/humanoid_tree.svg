<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Humanoid kinematic tree: pelvis root, 3-DoF abdomen to torso, neck to head, shoulders and elbows to the arms, hips knees and ankles to the feet, both feet bound to the board as a closed loop</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .name { font-size: 22px; font-weight: 700; fill: #111827; }
      .sub { font-size: 17px; fill: #374151; }
      .joint { font-size: 16px; font-weight: 700; fill: #374151; }
      .wire { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #2E9E50; stroke-width: 3; fill: none; stroke-dasharray: 8 6; }
      .root { fill: #F3F4F6; stroke: #9AA3AF; stroke-width: 2; }
      .core { fill: #EAF2FF; stroke: #2F6FDB; stroke-width: 2; }
      .arm { fill: #F2ECFF; stroke: #7C4DDB; stroke-width: 2; }
      .leg { fill: #FFF4E0; stroke: #D98A00; stroke-width: 2; }
      .board { fill: #E8F6EC; stroke: #2E9E50; stroke-width: 2; }
    </style>
  </defs>

  <!-- solid card: readable in GitHub's light and dark themes -->
  <rect x="1" y="1" width="1198" height="558" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- root -->
  <rect x="24" y="232" width="170" height="96" rx="12" class="root"/>
  <text x="44" y="272" class="name">Pelvis</text>
  <text x="44" y="304" class="sub">root, 8.2 kg</text>

  <!-- core -->
  <rect x="300" y="40" width="170" height="96" rx="12" class="core"/>
  <text x="320" y="80" class="name">Torso</text>
  <text x="320" y="112" class="sub">13.5 kg</text>
  <rect x="576" y="40" width="170" height="96" rx="12" class="core"/>
  <text x="596" y="80" class="name">Head</text>
  <text x="596" y="112" class="sub">6.5 kg</text>

  <!-- arms -->
  <rect x="576" y="176" width="170" height="96" rx="12" class="arm"/>
  <text x="596" y="216" class="name">Upper arm</text>
  <text x="596" y="248" class="sub">2.8 kg ×2</text>
  <rect x="852" y="176" width="170" height="96" rx="12" class="arm"/>
  <text x="872" y="216" class="name">Forearm</text>
  <text x="872" y="248" class="sub">+ hand, 2.2 kg ×2</text>

  <!-- legs -->
  <rect x="300" y="352" width="170" height="96" rx="12" class="leg"/>
  <text x="320" y="392" class="name">Thigh</text>
  <text x="320" y="424" class="sub">6.5 kg ×2</text>
  <rect x="576" y="352" width="170" height="96" rx="12" class="leg"/>
  <text x="596" y="392" class="name">Shin</text>
  <text x="596" y="424" class="sub">5.4 kg ×2</text>
  <rect x="852" y="352" width="170" height="96" rx="12" class="leg"/>
  <text x="872" y="392" class="name">Foot</text>
  <text x="872" y="424" class="sub">1.6 kg ×2</text>

  <!-- board -->
  <rect x="1062" y="320" width="118" height="160" rx="12" class="board"/>
  <text x="1076" y="390" class="name">Board</text>
  <text x="1076" y="420" class="sub">2.7 kg</text>

  <!-- wires with joint labels (DoF) -->
  <path d="M194,264 L240,264 L240,88 L296,88" class="wire"/>
  <text x="232" y="180" class="joint" text-anchor="end">abdomen 3</text>
  <path d="M470,88 L572,88" class="wire"/>
  <text x="488" y="76" class="joint">neck 3</text>
  <path d="M470,112 L520,112 L520,224 L572,224" class="wire"/>
  <text x="528" y="168" class="joint">shoulder 3</text>
  <path d="M746,224 L848,224" class="wire"/>
  <text x="764" y="212" class="joint">elbow 1</text>
  <path d="M194,296 L240,296 L240,400 L296,400" class="wire"/>
  <text x="232" y="360" class="joint" text-anchor="end">hip 3</text>
  <path d="M470,400 L572,400" class="wire"/>
  <text x="494" y="388" class="joint">knee 1</text>
  <path d="M746,400 L848,400" class="wire"/>
  <text x="764" y="388" class="joint">ankle 3</text>

  <!-- bindings -->
  <path d="M1022,384 L1062,384" class="loop"/>
  <path d="M1022,416 L1062,416" class="loop"/>
  <text x="852" y="500" class="joint" fill="#2E9E50">front binding: fixed joint (in tree)</text>
  <text x="852" y="526" class="joint" fill="#2E9E50">back binding: loop-closing constraint</text>

  <text x="24" y="526" class="sub">28 actuated DoF: abdomen 3 · neck 3 · 2 × (shoulder 3, elbow 1, hip 3, knee 1, ankle 3)</text>
</svg>
