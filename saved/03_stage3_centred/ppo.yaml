# PPO (on-policy): collect `rollouts` steps from every env, update on that batch, throw it away.
# Field reference: https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
num_envs: 2048
timesteps: 12000              # env steps per env at 30 Hz (12000 / 48 rollouts = 250 updates)

models:
  separate: True
  policy:
    class: GaussianMixin
    initial_log_std: -1.0       # exploration noise at the start (std = e^-1 ≈ 0.37): a bound rider falls from big flails
    max_log_std: -0.3           # std <= 0.74: it had grown to ~6 (actions are clipped, so the noise only made the rider jitter)
    network:
      - {name: net, input: OBSERVATIONS, layers: [512, 256, 128], activations: elu}
    output: ACTIONS
  value:
    class: DeterministicMixin
    network:
      - {name: net, input: OBSERVATIONS, layers: [512, 256, 128], activations: elu}
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1               # = rollouts

agent:
  class: PPO
  rollouts: 48                  # steps per env per update (48 x 2048 = 98k samples, 1.6 s: an edge change fits)
  learning_epochs: 5
  mini_batches: 8
  discount_factor: 0.995       # ~6.7 s horizon at 30 Hz: more than one 4 s S
  gae_lambda: 0.98
  learning_rate: 1.0e-3
  learning_rate_scheduler: KLAdaptiveLR   # shrinks lr when the policy changes too fast
  learning_rate_scheduler_kwargs: {kl_threshold: 0.01}
  observation_preprocessor: RunningStandardScaler
  value_preprocessor: RunningStandardScaler
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.003     # bonus for keeping exploration noise (0.01 inflated the std)
  value_loss_scale: 1.0
  time_limit_bootstrap: True

trainer:
  class: SequentialTrainer
  environment_info: log
