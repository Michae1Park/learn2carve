# learn2carve — physical facts for the stock Unitree G1 rider (CarveEnvCfg robot=g1). Same keys as physical.yaml.
# The robot is not changed; the board, stance and bindings are chosen to make riding as easy as possible for it.
# ALL VALUES IN SI UNITS (m, kg, s, deg).

rider:                    # Unitree G1 29-DoF + Dex3 hands, stock (Isaac Lab G1_29DOF_CFG)
  height: 1.32            # robot height, not used to scale it
  mass: 34.0              # kg, the USD's own masses (not rescaled)
  stance: regular         # left foot forward (toward the nose)
  stance_width: 0.35      # binding centre to centre: ~ the G1 shank (knee to sole 0.354 m)
  binding_angles_deg: [15.0, 15.0]   # feet parallel: the hips only yaw, knees bend across the board (edging)

board:                    # a youth board sized to the robot
  length: 1.18            # 118 cm, in the 115–120 cm range for a 132 cm rider
  effective_edge: 0.88    # m
  waist_width: 0.22       # the G1 foot is 0.15 m long; boots overhang less than an adult's
  nose_width: 0.247
  tail_width: 0.247
  sidecut_radius: [9.5, 6.5, 9.5]
  sidecut_radius_eff: 7.6 # m, kept from the adult board: the same edge angle turns no tighter.
                          #   depth d = (0.247 - 0.22) / 2 = 0.0135 m, R ≈ 0.88² / (8 d) = 7.2 m
  setback: 0.0            # centred stance: equal load on both feet
  thickness: 0.008
  mass: 1.7               # kg, a youth board (1.5–2.0 kg)

piste:
  fence_half_width: 20.0

snow:                     # as physical.yaml, drag area scaled to the smaller body
  mu_glide: 0.05
  mu_flat: 0.15
  mu_edge: 1.5
  edge_lock_deg: 15.0
  min_edge_deg: 3.0
  k_yaw: 50.0
  cd_area: 0.3            # m², smaller frontal area than the 1.65 m rider (0.5)
  air_density: 1.0
  grip_stiffness: 20000.0
  grip_damping: 800.0
